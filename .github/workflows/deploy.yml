name: deploy

# Cloudflare's git integration (Workers Builds) already deploys every push to
# master — this workflow only covers tags, which Cloudflare does not trigger on.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Skip instead of failing while the Cloudflare secrets are not configured.
      - name: Check credentials
        id: creds
        run: echo "ok=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      # wrangler.toml carries [build] + [assets], so wrangler installs,
      # builds and uploads dist/ in one go.
      - name: Deploy to Cloudflare
        if: steps.creds.outputs.ok == 'true'
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Missing credentials
        if: steps.creds.outputs.ok != 'true'
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN is not set — skipping deploy."
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions."
